volumes:
  hive-db:      # Postgres data (stays local: a database can't live on S3)
  # Table data (Parquet + Iceberg metadata) now lives on PowerScale S3,
  # bucket ${POWERSCALE_BUCKET}, under the "hive/" prefix. No local volume needed.

networks:
  hive: {}

services:
  # 1️⃣ PostgreSQL 14  –  back-end DB for Hive Metastore
  postgres:
    image: postgres:14
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_DB: hive_metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - hive-db:/var/lib/postgresql/data
      - ./jars/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U hive"]
      interval: 10s
      retries: 5
    networks: [ hive ]

  # 2️⃣ Hive Metastore service (4.0.0)   –   catalog layer
  metastore:
    image: apache/hive:4.0.0
    # platform: linux/amd64              # uncomment if you’re on Apple silicon
    restart: unless-stopped
    container_name: metastore
    depends_on:
      postgres:
        condition: service_healthy       # wait until PG answers
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # Credentials and endpoint for the S3A connector (read by core-site.xml)
      AWS_ACCESS_KEY_ID: ${POWERSCALE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${POWERSCALE_SECRET_KEY}
      S3_ENDPOINT: http://${POWERSCALE_HOST}:${POWERSCALE_PORT}
      # The two disable*MD5Validation flags stop the AWS SDK v1 from comparing
      # MD5s with PowerScale ETags (PowerScale ETags are not MD5s).
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.warehouse.dir=s3a://${POWERSCALE_BUCKET}/hive
        -Dhive.metastore.warehouse.external.dir=s3a://${POWERSCALE_BUCKET}/hive/external
        -Dcom.amazonaws.services.s3.disablePutObjectMD5Validation=true
        -Dcom.amazonaws.services.s3.disableGetObjectMD5Validation=true
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=password
    ports: ["9083:9083"]                 # Thrift endpoint
    volumes:
      - ./jars/postgresql-42.7.3.jar:/opt/hive/lib/postgres.jar:ro
      # S3A connector so the metastore can create database folders on PowerScale
      - ./jars/hadoop-aws-3.3.6.jar:/opt/hive/lib/hadoop-aws-3.3.6.jar:ro
      - ./jars/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:ro
      # Your file is s3a_hms.xml; inside the container it MUST be named core-site.xml
      - ./s3a_hms.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    networks: [ hive ]

  # 3️⃣ Spark 3.5 + Iceberg 1.10 + Jupyter (Tabular image, Iceberg jars upgraded for PowerScale)
  spark:
    image: spark-iceberg-powerscale
    build: ./spark-powerscale
    # platform: linux/amd64        # Tabular’s image is x86-only; add on Apple silicon
    restart: unless-stopped
    container_name: spark
    depends_on: [ metastore ]
    networks: [ hive ]
    ports:
      - "8888:8888"                      # Jupyter Lab
      - "4040:4040"                      # Spark UI
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./notebooks:/home/iceberg/notebooks:rw  # Jupyter in the Spark container can create, edit, and delete notebooks
      - ./jars/postgresql-42.7.3.jar:/opt/spark/jars/postgres.jar:ro  # JDBC driver added to connect spark-postgresql

    environment:
      SPARK_DRIVER_MEMORY: 1G
      AWS_ACCESS_KEY_ID: ${POWERSCALE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${POWERSCALE_SECRET_KEY}
      AWS_REGION: us-east-1
      # Only send/check checksums when S3 requires them (safer for PowerScale)
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

  # 4️⃣ Trino  –  second query engine on the same metastore and the same warehouse
  trino:
    image: trinodb/trino:latest          # pin a version for a stable demo
    restart: unless-stopped
    container_name: trino
    depends_on: [ metastore ]
    networks: [ hive ]
    ports:
      - "8080:8080"                      # Trino web UI + JDBC/HTTP endpoint
    environment:
      # Read by ${ENV:...} in trino/catalog/iceberg.properties
      AWS_ACCESS_KEY_ID: ${POWERSCALE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${POWERSCALE_SECRET_KEY}
      S3_ENDPOINT: http://${POWERSCALE_HOST}:${POWERSCALE_PORT}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
