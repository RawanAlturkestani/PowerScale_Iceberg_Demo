spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Spark's built-in catalog (spark_catalog) on the Hive Metastore ---
# Lets Spark see every database/table in HMS without a catalog prefix,
# for both Iceberg and plain Hive tables.
spark.sql.catalogImplementation               hive
spark.hadoop.hive.metastore.uris              thrift://metastore:9083
spark.sql.warehouse.dir                       s3a://warehouse/hive
spark.sql.catalog.spark_catalog               org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type          hive
spark.sql.catalog.spark_catalog.uri           thrift://metastore:9083
spark.sql.catalog.spark_catalog.io-impl       org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.spark_catalog.s3.endpoint   http://<PowerScale IP>:9020
spark.sql.catalog.spark_catalog.s3.path-style-access true

# --- Dedicated Iceberg catalog on the same Hive Metastore ---
# Same tables, addressed as iceberg.<db>.<table> (matches Trino's catalog name)
spark.sql.catalog.iceberg                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type                hive
spark.sql.catalog.iceberg.uri                 thrift://metastore:9083
spark.sql.catalog.iceberg.warehouse           s3a://warehouse/hive
spark.sql.catalog.iceberg.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint         http://<PowerScale IP>:9020
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.defaultCatalog                      iceberg

# --- S3A settings, used by Spark for plain (non-Iceberg) Hive tables ---
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the container
spark.hadoop.fs.s3a.endpoint                  http://<PowerScale IP>:9020
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
# S3A uses the AWS SDK v1, which compares MD5s with ETags. PowerScale ETags are
# not MD5s, so switch that check off (same flags as the metastore uses).
spark.driver.extraJavaOptions                 -Dcom.amazonaws.services.s3.disablePutObjectMD5Validation=true -Dcom.amazonaws.services.s3.disableGetObjectMD5Validation=true
spark.executor.extraJavaOptions               -Dcom.amazonaws.services.s3.disablePutObjectMD5Validation=true -Dcom.amazonaws.services.s3.disableGetObjectMD5Validation=true

# Replace 192.168.1.21:9020 above if your PowerScale address changes (same values as .env)

spark.eventLog.enabled                        true
spark.eventLog.dir                            /home/iceberg/spark-events
spark.history.fs.logDirectory                 /home/iceberg/spark-events
